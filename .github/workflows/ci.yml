name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Publish dry-run
        run: dart pub publish --dry-run

  min-sdk:
    name: Analyze and test on the minimum Flutter (3.32.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - run: flutter --version

      # The example tracks the current stable SDK and cannot resolve on
      # Dart 3.8, and pub on 3.32 has no --no-example flag.
      - name: Drop the example
        run: rm -rf example

      - name: Get dependencies
        run: flutter pub get

      # Formatting is skipped here: formatter output differs between SDKs.
      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test
